<!doctype html>
<meta charset="utf-8">
<title>The Garage — feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Tokens are DESIGN.md §2.1 verbatim. Nothing here invents a colour. */
  :root {
    --ink-0:#12101A; --ink-1:#1C1930; --ink-2:#2A2545; --ink-3:#3D3763;
    --paper:#E8E4D8; --paper-dim:#9B96A8; --work:#FFB13D;
    --pass:#3DDC97; --fail:#FF5D5D; --wire:#5BC8F5;
    --font-display:"Silkscreen","Courier New",monospace;
    --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ink-0); color:var(--paper);
    font:14px/1.55 var(--font-data);
    display:grid; grid-template-rows:48px 1fr; height:100vh;
  }
  /* top bar */
  header {
    display:flex; align-items:center; gap:16px; padding:0 16px;
    background:var(--ink-1); border-bottom:1px solid var(--ink-3);
  }
  h1 { font:16px var(--font-display); margin:0; letter-spacing:.5px;
       color:var(--paper); text-transform:uppercase; }
  select {
    background:var(--ink-2); color:var(--paper); border:1px solid var(--ink-3);
    font:14px var(--font-data); padding:4px 8px; border-radius:2px;
  }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block;
         background:var(--paper-dim); }
  .dot.live { background:var(--wire); box-shadow:0 0 8px var(--wire); }
  .status { color:var(--paper-dim); font-size:12px; }
  main { display:grid; grid-template-columns:1fr 240px; overflow:hidden; }
  /* feed */
  #feed { overflow-y:auto; padding:8px 0; }
  .row {
    display:grid; grid-template-columns:72px 108px 178px 1fr;
    gap:10px; padding:2px 16px; align-items:baseline;
    border-left:2px solid transparent;
  }
  .row:hover { background:var(--ink-1); }
  .row.clickable { cursor:pointer; }
  .row.clickable:hover { border-left-color:var(--work); }
  .t  { color:var(--paper-dim); font-size:12px; }
  .ag, .ty { white-space:nowrap; }
  .ag { color:var(--paper-dim); }
  .ty { color:var(--paper); }
  /* verdict rows tint their TEXT, never their background (DESIGN §5.1) */
  .row.pass .ty, .row.pass .kv { color:var(--pass); }
  .row.fail .ty, .row.fail .kv { color:var(--fail); }
  .kv { color:var(--paper-dim); white-space:pre-wrap; word-break:break-word; }
  .glyph { margin-right:6px; }
  /* right rail */
  aside { background:var(--ink-1); border-left:1px solid var(--ink-3);
          padding:12px 14px; overflow-y:auto; }
  aside h2 { font:12px var(--font-display); color:var(--paper-dim);
             margin:14px 0 4px; letter-spacing:.5px; }
  aside h2:first-child { margin-top:0; }
  .big { font:14px var(--font-data); color:var(--paper); word-break:break-all; }
  .spend { color:var(--work); font-variant-numeric:tabular-nums; }
  .stamps { letter-spacing:3px; font-size:15px; }
  hr { border:0; border-top:1px solid var(--ink-3); margin:12px 0; }
  /* artifact panel */
  #artifact {
    position:fixed; inset:auto 0 0 0; max-height:52vh; overflow:auto;
    background:var(--ink-2); border-top:1px solid var(--ink-3);
    padding:12px 16px; display:none; white-space:pre; font-size:12.5px;
  }
  #artifact.open { display:block; }
  #artifact .close { float:right; color:var(--work); cursor:pointer; }
  .empty { color:var(--paper-dim); padding:24px 16px; }
</style>

<header>
  <h1>The&nbsp;Garage</h1>
  <select id="runs"></select>
  <span><span class="dot" id="dot"></span> <span class="status" id="status">idle</span></span>
</header>

<main>
  <div id="feed"><div class="empty">pick a run</div></div>
  <aside>
    <h2>Task</h2><div class="big" id="task">—</div>
    <h2>Attempt</h2><div class="big" id="attempt">—</div>
    <hr>
    <h2>Gates</h2>
    <div class="big">tests <span class="stamps" id="gtests"></span></div>
    <div class="big">review <span class="stamps" id="greview"></span></div>
    <hr>
    <h2>Spend</h2><div class="big spend" id="spend">$0.0000</div>
    <h2>Shipped</h2><div class="big" id="shipped">0</div>
    <h2>Failed</h2><div class="big" id="failed">0</div>
  </aside>
</main>

<div id="artifact"><span class="close" onclick="closeArtifact()">close ✕</span><div id="artifactBody"></div></div>

<script>
// The reducer. SceneState is derived 100% from events (FR-18) -- this file
// never asks the engine anything, and there is nothing else to ask.
const S = { task:"—", attempt:"—", tests:[], review:[], spend:0, shipped:0, failed:0 };
let ws = null, runId = null;

const $ = id => document.getElementById(id);
const feed = $("feed");

function reduce(e) {
  const p = e.payload || {};
  switch (e.type) {
    case "task_started":  S.task = e.task_id; S.attempt = "—";
                          S.tests = []; S.review = []; break;
    case "agent_activated": if (p.attempt) S.attempt = p.attempt; break;
    case "gate_verdict":
      (p.gate === "tests" ? S.tests : S.review).push(p.verdict); break;
    case "cost_tick":     if (typeof p.usd === "number") S.spend = p.usd; break;
    case "shipped":       S.shipped++; break;
    case "task_failed":   S.failed++; break;
    // Unknown types are ignored on purpose (schema v:1 forward-compat rule).
  }
}

const stamp = v => v === "pass" || v === "accept" ? "✓" : v === "reject" || v === "fail" ? "✗" : "·";

function paintHud() {
  $("task").textContent = S.task;
  $("attempt").textContent = S.attempt;
  $("gtests").textContent = S.tests.map(stamp).join("") || "·";
  $("greview").textContent = S.review.map(stamp).join("") || "·";
  $("spend").textContent = "$" + S.spend.toFixed(4);
  $("shipped").textContent = S.shipped;
  $("failed").textContent = S.failed;
}

function verdictClass(e) {
  const v = (e.payload || {}).verdict;
  if (e.type === "shipped" || v === "pass" || v === "accept") return "pass";
  if (e.type === "task_failed" || e.type === "patch_apply_error"
      || v === "fail" || v === "reject") return "fail";
  return "";
}

function addRow(e) {
  const p = e.payload || {};
  const kv = Object.entries(p)
    .filter(([k]) => k !== "artifact")
    .map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`)
    .join(" ");
  const row = document.createElement("div");
  row.className = "row " + verdictClass(e) + (p.artifact ? " clickable" : "");
  const g = verdictClass(e) === "pass" ? "✓" : verdictClass(e) === "fail" ? "✗" : " ";
  row.innerHTML =
    `<span class="t">${(e.ts || "").slice(11, 19)}</span>` +
    `<span class="ag">${e.agent}</span>` +
    `<span class="ty"><span class="glyph">${g}</span>${e.type}</span>` +
    `<span class="kv">${kv.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>`;
  if (p.artifact) row.onclick = () => openArtifact(p.artifact);
  const stuck = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40;
  feed.appendChild(row);
  if (stuck) feed.scrollTop = feed.scrollHeight;
}

async function openArtifact(path) {
  const r = await fetch(`/api/runs/${runId}/artifacts/${path}`);
  $("artifactBody").textContent = r.ok ? await r.text() : `not found: ${path}`;
  $("artifact").classList.add("open");
}
function closeArtifact() { $("artifact").classList.remove("open"); }

function setStatus(text, live) {
  $("status").textContent = text;
  $("dot").className = "dot" + (live ? " live" : "");
}

function open(id) {
  runId = id;
  if (ws) { ws.close(); ws = null; }
  feed.innerHTML = "";
  Object.assign(S, { task:"—", attempt:"—", tests:[], review:[], spend:0, shipped:0, failed:0 });
  paintHud();
  setStatus("connecting…", false);

  // One socket serves both cases: after_seq=0 replays a finished run from the
  // start, and a reconnect would pass its last seq. Same code path (TAD §5.1).
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/live/${id}?after_seq=0`);
  ws.onopen = () => setStatus("live", true);
  ws.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (e.error) { setStatus(e.error, false); return; }
    reduce(e); addRow(e); paintHud();
    if (e.type === "run_finished") setStatus("run finished", false);
  };
  ws.onclose = () => $("dot").classList.remove("live");
  ws.onerror = () => setStatus("connection error", false);
}

async function loadRuns() {
  const runs = await (await fetch("/api/runs")).json();
  const sel = $("runs");
  sel.innerHTML = "";
  if (!runs.length) { feed.innerHTML = '<div class="empty">no runs with an event log yet — try:  uv run python -m engine.cli run-one --task django__django-11099 --model stub</div>'; return; }
  for (const r of runs) {
    const o = document.createElement("option");
    o.value = r.run_id;
    o.textContent = `${r.run_id}  ·  ${r.events} events` +
      (r.running ? "  · running" : "") + (r.invalid ? "  · INVALID" : "");
    sel.appendChild(o);
  }
  sel.onchange = () => open(sel.value);
  open(runs[0].run_id);
}
loadRuns();
</script>
