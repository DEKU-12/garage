<!doctype html>
<meta charset="utf-8">
<title>The Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* DESIGN.md §2.1 tokens, verbatim. Nothing here invents a colour. */
  :root {
    /* the four that carry meaning -- used nowhere decorative (§2.2) */
    --work:#F0B24B; --pass:#46B46A; --fail:#D95A5A; --wire:#4D8FDB;
    /* the room */
    --coal:#211B19; --walnut:#4A382D; --concrete:#6D5B48; --tan:#B8A68B;
    --parchment:#E8DAB9; --warm:#D8C18A;
    --coal-lift:#2C2422; --walnut-lift:#5C4736;
    --font-display:"Silkscreen","Courier New",monospace;
    --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--coal); color:var(--parchment);
    font:14px/1.5 var(--font-data); height:100vh;
    display:grid; grid-template-rows:48px 1fr 94px 60px 116px;
  }
  /* the demo must work with the garage off (DESIGN §5.1) */
  body[data-feed-only="1"] { grid-template-rows:48px 0 0 60px 1fr; }
  body[data-feed-only="1"] main, body[data-feed-only="1"] #strip { display:none; }

  header {
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:var(--coal-lift); border-bottom:1px solid var(--walnut);
  }
  h1 { font:16px var(--font-display); margin:0; text-transform:uppercase;
       letter-spacing:.5px; color:var(--parchment); }
  select, button {
    background:var(--walnut); color:var(--parchment); border:1px solid var(--walnut-lift);
    font:13px var(--font-data); padding:4px 8px; border-radius:3px; cursor:pointer;
  }
  button:focus-visible, select:focus-visible { outline:2px solid var(--work); outline-offset:1px; }
  .dot { width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--tan); }
  .dot.live { background:var(--work); box-shadow:0 0 8px var(--work); }
  .status { color:var(--tan); font-size:12px; }
  .spacer { flex:1; }
  .lbl { font-size:11px; color:var(--tan); }

  /* Tape, not a media player (DESIGN §5.2). */
  #transport { display:flex; align-items:center; gap:10px; padding:0 12px;
               background:var(--coal-lift); border-top:1px solid var(--walnut); }
  #transport button { padding:3px 8px; min-width:30px; }
  #transport button.on { border-color:var(--work); color:var(--work); }
  #tapewrap { flex:1; position:relative; height:38px; }
  #tape { width:100%; height:38px; display:block; cursor:ew-resize;
          border:1px solid var(--walnut); border-radius:3px; }
  .readout { font-size:11.5px; color:var(--tan); white-space:nowrap;
             font-variant-numeric:tabular-nums; }
  .readout b { color:var(--parchment); font-weight:400; }
  .speeds { display:flex; gap:3px; }

  /* Artifact panel: payloads carry pointers, so this is the lazy fetch. */
  #art { position:fixed; right:0; top:48px; bottom:0; width:min(560px,52vw);
         background:var(--coal-lift); border-left:1px solid var(--walnut);
         display:none; flex-direction:column; z-index:20; }
  #art.open { display:flex; }
  #arthead { display:flex; align-items:center; gap:10px; padding:9px 12px;
             border-bottom:1px solid var(--walnut); }
  #arttitle { font:11px var(--font-display); letter-spacing:.5px; flex:1; }
  #artbody { flex:1; overflow:auto; margin:0; padding:12px;
             font:12px/1.5 var(--font-data); color:var(--tan);
             white-space:pre-wrap; word-break:break-word; }
  .row.has { cursor:pointer; }
  .row.has:hover { background:var(--coal-lift); }

  /* Hovering a mechanic during replay (FR-28). */
  #tip { position:fixed; z-index:30; display:none; max-width:280px;
         background:var(--coal-lift); border:1px solid var(--walnut-lift);
         border-radius:4px; padding:8px 10px; pointer-events:none;
         box-shadow:0 6px 18px rgba(0,0,0,.45); }
  #tip.on { display:block; }
  #tip b { font:11px var(--font-display); letter-spacing:.5px; color:var(--parchment); }
  #tip .tr { font-size:11px; color:var(--tan); }
  #tip .td { font-size:11.5px; color:var(--tan); margin-top:3px; line-height:1.35; }
  #tip .te { font-size:11.5px; color:var(--warm); margin-top:5px; word-break:break-word; }
  #tip .tl { font-size:11px; color:var(--tan); margin-top:4px; }

  main { display:grid; grid-template-columns:1fr 258px; overflow:hidden; }
  #stage { display:grid; place-items:center; overflow:hidden; background:var(--coal); }
  #stage canvas { image-rendering:pixelated; }
  aside { background:var(--coal-lift); border-left:1px solid var(--walnut);
          padding:12px 14px; overflow-y:auto; }
  aside h2 { font:11px var(--font-display); color:var(--tan); margin:14px 0 3px; letter-spacing:.5px; }
  aside h2:first-child { margin-top:0; }
  .big { font-size:13px; word-break:break-all; }
  .spend { color:var(--work); font-variant-numeric:tabular-nums; font-size:15px; }
  .stamps { letter-spacing:3px; }
  .stamps .ok { color:var(--pass); } .stamps .no { color:var(--fail); }
  hr { border:0; border-top:1px solid var(--walnut); margin:11px 0; }

  /* Crew panel: doubles as the on-screen legend, since the mechanics are told
     apart by silhouette plus one colour (DESIGN §4.3). */
  .who { display:grid; grid-template-columns:10px 1fr; gap:8px; margin:0 0 8px; }
  .who .sw { width:10px; height:10px; margin-top:3px; border-radius:2px; }
  .who .nm { font:11px var(--font-display); letter-spacing:.5px; }
  .who .rid { color:var(--tan); font-size:10px; }
  .who .rl { color:var(--tan); font-size:11.5px; line-height:1.35; margin-top:1px; }
  .who.on .nm { color:var(--work); }
  .who.on .sw { box-shadow:0 0 7px var(--work); }

  /* The roster strip. Same singular-work rule as the station lamps, so exactly
     one card is ever lit. */
  #strip { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px;
           padding:8px 12px; background:var(--coal-lift);
           border-top:1px solid var(--walnut); }
  .card { display:flex; align-items:center; gap:9px; padding:7px 9px;
          background:var(--walnut); border:1px solid var(--walnut-lift);
          border-radius:4px; min-width:0; }
  .card.on { border-color:var(--work); box-shadow:0 0 0 1px var(--work) inset; }
  .pt { position:relative; width:30px; height:30px; flex:none; border-radius:3px;
        border:1px solid var(--coal); overflow:hidden; }
  .pt i { position:absolute; display:block; }
  .pt .ht { left:5px; top:2px; width:20px; height:8px; border-radius:3px 3px 0 0; }
  .pt .fc { left:8px; top:8px; width:14px; height:13px; border-radius:2px; }
  .meta { display:flex; flex-direction:column; min-width:0; }
  .cn { font:11px var(--font-display); letter-spacing:.5px; color:var(--parchment); }
  .cr { font-size:11px; color:var(--tan); }
  .cs { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--tan); }
  .dotp { width:6px; height:6px; border-radius:50%; background:var(--tan); flex:none; }
  .card.on .cn { color:var(--work); }
  .card.on .dotp { background:var(--work); box-shadow:0 0 6px var(--work); }
  .card.on .st { color:var(--work); }

  /* the feed drawer never dies (DESIGN §5.1) */
  #feed { overflow-y:auto; background:var(--coal); border-top:1px solid var(--walnut);
          padding:6px 0; }
  .row { display:grid; grid-template-columns:70px 100px 168px 1fr; gap:10px; padding:1px 16px; }
  .row .t { color:var(--tan); font-size:11.5px; }
  .row .ag, .row .ty { white-space:nowrap; }
  .row .ag { color:var(--warm); }
  .row .kv { color:var(--tan); white-space:pre-wrap; word-break:break-word; font-size:12.5px; }
  .row.pass .ty, .row.pass .kv { color:var(--pass); }
  .row.fail .ty, .row.fail .kv { color:var(--fail); }
</style>

<header>
  <h1>The&nbsp;Garage</h1>
  <select id="runs"></select>
  <span><span class="dot" id="dot"></span> <span class="status" id="status">idle</span></span>
  <span class="spacer"></span>
</header>

<main>
  <div id="stage"></div>
  <aside>
    <h2>Task</h2><div class="big" id="task">—</div>
    <h2>Attempt</h2><div class="big" id="attempt">—</div>
    <hr>
    <h2>Gates</h2>
    <div class="big">tests <span class="stamps" id="gtests">·</span></div>
    <div class="big">review <span class="stamps" id="greview">·</span></div>
    <hr>
    <h2>Spend</h2><div class="big spend" id="spend">$0.0000</div>
    <h2>Shipped</h2><div class="big" id="shipped">0</div>
    <h2>Failed</h2><div class="big" id="failed">0</div>
    <hr>
    <h2>Crew</h2><div id="crew"></div>
  </aside>
</main>

<div id="strip"></div>

<div id="transport">
  <button id="restart" title="back to the start">&#9198;</button>
  <button id="stepb" title="one event back (left arrow)">&#8249;</button>
  <button id="play" title="play / pause (space)">&#9654;</button>
  <button id="stepf" title="one event forward (right arrow)">&#8250;</button>
  <span class="speeds">
    <button data-speed="1" class="on">1x</button>
    <button data-speed="4">4x</button>
    <button data-speed="16">16x</button>
  </span>
  <div id="tapewrap"><canvas id="tape"></canvas></div>
  <span class="readout">event <b id="count">0 / 0</b> &middot; <b id="stamp">--:--:--</b> &middot; <b id="elapsed">+00:00</b></span>
  <button id="golive" title="jump to the end and follow the tail">go live</button>
  <button id="toggleFeed">feed only</button>
</div>

<div id="feed"></div>

<div id="tip"></div>

<div id="art">
  <div id="arthead">
    <span id="arttitle">artifact</span>
    <button id="artclose">close</button>
  </div>
  <pre id="artbody"></pre>
</div>

<script src="/garage/vendor/pixi.min.js"></script>
<script src="/garage/garage.js"></script>
